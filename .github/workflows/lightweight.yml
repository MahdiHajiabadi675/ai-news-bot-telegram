name: AI News Lightweight

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lightweight
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and translate
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.collectors import collect
          from src.storage import load_seen, save_seen, load_pending, save_pending, load_approved, save_approved
          from src.fallback_translator import translate_with_fallback
          from src.config import TRUST_SCORES, REJECT_KEYWORDS

          print('[INFO] Starting lightweight collection...')
          seen = load_seen()
          articles = collect(seen)

          articles = [a for a in articles if not any(kw.lower() in a['title'].lower() for kw in REJECT_KEYWORDS)]

          if not articles:
              print('[INFO] No new articles')
              sys.exit(0)

          pending = load_pending()
          approved = load_approved()
          added = 0

          for a in articles:
              if a['lang'] == 'fa':
                  title_fa = a['title']
                  summary_fa = a['summary'][:400]
              else:
                  translated = translate_with_fallback(a['title'], a['summary'])
                  if translated:
                      title_fa = translated.get('title_fa', a['title'])
                      summary_fa = translated.get('summary_fa', a['summary'][:400])
                  else:
                      title_fa = a['title']
                      summary_fa = a['summary'][:400]

              source_trust = TRUST_SCORES.get(a['source'], 3)
              score = int((source_trust / 5) * 50)

              item = {
                  'id': a.get('id', ''),
                  'source': a['source'],
                  'lang': a['lang'],
                  'trusted': a.get('trusted', False),
                  'title': a['title'],
                  'link': a['link'],
                  'summary': a['summary'],
                  'title_fa': title_fa,
                  'summary_fa': summary_fa,
                  'importance': 'medium',
                  'confidence': 'likely',
                  'category': 'other',
                  'hashtags': ['AI'],
                  'admin_question': '',
                  'status': 'analyzed',
                  'source_trust': source_trust,
                  'score': score
              }

              if a.get('trusted', False) and score >= 35:
                  item['status'] = 'approved'
                  item['admin_action'] = 'auto_approved'
                  approved.append(item)
              else:
                  pending.append(item)

              seen.add(a.get('id', ''))
              added += 1

          save_seen(seen)
          save_pending(pending)
          save_approved(approved)
          print(f'[INFO] Added {added} articles')
          "

      - name: Trigger worker to publish
        run: |
          curl -s -X POST "${{ secrets.WORKER_URL }}/run" \
            -H "Authorization: Bearer ${{ secrets.WORKER_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30
