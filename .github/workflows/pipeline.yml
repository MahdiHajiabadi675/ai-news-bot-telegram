name: AI News Pipeline

on:
  schedule:
    # Avoid the start of the hour, when GitHub Actions is most congested.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'cron = فراخوانی خودکار Cloudflare (بدون force)؛ خالی/manual = اجرای دستی با force'
        required: false
        default: 'manual'

permissions:
  contents: write

concurrency:
  group: pipeline
  # Do not cancel an active collection/publish run when the next hourly event arrives.
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sanity check
        # تست‌های کامل در tests.yml (روی هر push) اجرا می‌شوند؛ اینجا فقط بررسی سریع که کد import می‌شود
        run: python -c "import main"

      - name: Run pipeline
        # ورودی dispatch مستقیم داخل shell نمی‌رود (جلوگیری از command injection)
        env:
          TRIGGER: ${{ inputs.trigger }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # هندل عمومی کانال برای خواندن بازدید از t.me/s (بدون آن، این قابلیت خاموش می‌ماند)
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          # آدرس سایت برای پست تبلیغ دوره‌ای (از Secrets یا Variables؛ هرکدام تنظیم شده باشد)
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$TRIGGER" != "cron" ]; then
            python main.py run --force
          else
            python main.py run
          fi

      # نکته: انتشار اخبارِ تاییدشده داخل خود همین pipeline انجام می‌شه
      # (src/publisher.py). دکمه «تایید» ادمین هم از طریق Cloudflare Worker
      # بلافاصله منتشر می‌کنه. برای جلوگیری از پست تکراری، اینجا /run صدا زده نمی‌شه.
